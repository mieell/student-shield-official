name: ML service health check

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ML service
        run: curl --fail --silent --show-error --location --max-time 60 https://ashlogg-student-shield-official.hf.space/
